<div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px;">
  <h2 style="margin:0;">Demandantes</h2>

  <div style="display:flex; gap:12px; align-items:center;">
    <mat-form-field appearance="outline" style="width:280px;">
      <mat-label>Buscar</mat-label>
      <input matInput [(ngModel)]="filter" placeholder="Nombre o ciudad">
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="goNew()">
      <mat-icon>add</mat-icon>
      Nuevo
    </button>
  </div>
</div>

<table mat-table [dataSource]="(filtered$ | async) ?? []" class="mat-elevation-z1" style="width:100%;">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let x">{{ x.name }}</td>
  </ng-container>

  <ng-container matColumnDef="active">
    <th mat-header-cell *matHeaderCellDef>Activo</th>
    <td mat-cell *matCellDef="let x">{{ x.active ? 'Sí' : 'No' }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef class="actions-col">Acciones</th>

    <td mat-cell *matCellDef="let x" class="actions-col">
      <div class="actions-wrap">
        <button
          mat-icon-button
          type="button"
          (click)="goEdit(x.id)"
          aria-label="Editar">
          <mat-icon>edit</mat-icon>
        </button>

        <mat-slide-toggle
          [checked]="x.active"
          (change)="toggle(x.id)"
          color="primary"
          aria-label="Activo">
        </mat-slide-toggle>
      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
