<div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px;">
  <h2 style="margin:0;">
    {{ isEdit ? 'Editar Juzgado' : 'Nuevo Juzgado' }}
  </h2>

  <div style="display:flex; gap:12px;">
    <button mat-button type="button" (click)="cancel()">Cancelar</button>
    <button mat-raised-button color="primary" type="button" (click)="save()" [disabled]="loading">
      {{ loading ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>
</div>

<div *ngIf="error" style="color:#b00020; margin-bottom:12px;">{{ error }}</div>

<form [formGroup]="form" style="display:flex; flex-direction:column; gap:12px; max-width:720px;">
  <mat-form-field appearance="outline">
    <mat-label>Nombre</mat-label>
    <input matInput formControlName="name">
    <mat-error *ngIf="nameCtrl?.invalid && nameCtrl?.touched">
      Nombre requerido (mín 2)
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Ciudad</mat-label>
    <input matInput formControlName="city">
    <mat-error *ngIf="cityCtrl?.invalid && cityCtrl?.touched">
      Ciudad requerida (mín 2)
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Descripción</mat-label>
    <textarea matInput rows="3" formControlName="description"></textarea>
  </mat-form-field>

  <mat-slide-toggle formControlName="active" color="primary">
    {{ form.get('active')?.value ? 'Activo' : 'Inactivo' }}
  </mat-slide-toggle>
</form>
