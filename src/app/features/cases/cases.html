<h1>Listado de Casos</h1>

<div class="filters">

  <mat-form-field>
    <mat-label>Radicado</mat-label>
    <input matInput [(ngModel)]="filterRadicado" (keyup)="applyFilters()">
  </mat-form-field>

  <button mat-button type="button" (click)="clearFilters()">
    Limpiar
  </button>

  <span class="spacer"></span>

  <button mat-stroked-button type="button" [disabled]="exporting" (click)="exportToExcel()">
    <mat-icon>download</mat-icon>
    {{ exporting ? 'Exportando…' : 'Exportar a Excel' }}
  </button>

  <button mat-raised-button color="primary" (click)="newCase()">
    Nuevo
  </button>
</div>

<div class="table-scroll-wrapper">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" style="width:100%;" matSort (matSortChange)="announceSortChange($event)">
    <ng-container matColumnDef="defendantName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Demandado</th>
      <td mat-cell *matCellDef="let c">{{ getDefendantName(c) }}</td>
    </ng-container>

    <ng-container matColumnDef="document">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>documento</th>
      <td mat-cell *matCellDef="let c">{{ getDocument(c) }}</td>
    </ng-container>

    <ng-container matColumnDef="observationsCount">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Observaciones</th>
      <td mat-cell *matCellDef="let c">{{ getObservationsCount(c) }}</td>
    </ng-container>

    <ng-container matColumnDef="alert">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Alerta</th>
      <td mat-cell *matCellDef="let c">
        <span class="badge"
          [class.badge-red]="getAlertClass(c) === 'red'"
          [class.badge-orange]="getAlertClass(c) === 'orange'"
          [class.badge-green]="getAlertClass(c) === 'green'">
          {{ getAlertLabel(c) }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let c">
        <button mat-icon-button color="primary" (click)="editCase(c)">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>

<mat-paginator
  [pageSize]="5"
  [pageSizeOptions]="[5,10,25]"
  showFirstLastButtons>
</mat-paginator>
