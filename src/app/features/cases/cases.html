<h1>Listado de Casos</h1>

<div class="filters">

  <mat-form-field>
    <mat-label>Radicado</mat-label>
    <input matInput [(ngModel)]="filterRadicado" (keyup)="applyFilters()">
  </mat-form-field>

  <mat-form-field>
    <mat-label>Tipo de Proceso</mat-label>
    <input matInput [(ngModel)]="filterProcessType" (keyup)="applyFilters()">
  </mat-form-field>

  <mat-form-field>
    <mat-label>Ciudad</mat-label>
    <input matInput [(ngModel)]="filterCity" (keyup)="applyFilters()">
  </mat-form-field>

  <mat-form-field>
    <mat-label>Juzgado</mat-label>
    <input matInput [(ngModel)]="filterCourt" (keyup)="applyFilters()">
  </mat-form-field>

  <span class="spacer"></span>

  <button mat-raised-button color="primary" (click)="newCase()">
    Nuevo
  </button>

</div>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8" style="width:100%;">

  <ng-container matColumnDef="radicado">
    <th mat-header-cell *matHeaderCellDef>Radicado</th>
    <td mat-cell *matCellDef="let c">{{ c.process.radicado }}</td>
  </ng-container>

  <ng-container matColumnDef="processType">
    <th mat-header-cell *matHeaderCellDef>Tipo</th>
    <td mat-cell *matCellDef="let c">{{ c.process.processType }}</td>
  </ng-container>

  <ng-container matColumnDef="court">
    <th mat-header-cell *matHeaderCellDef>Juzgado</th>
    <td mat-cell *matCellDef="let c">{{ c.process.court }}</td>
  </ng-container>

  <ng-container matColumnDef="city">
    <th mat-header-cell *matHeaderCellDef>Ciudad</th>
    <td mat-cell *matCellDef="let c">{{ c.process.city }}</td>
  </ng-container>

  <ng-container matColumnDef="alert">
    <th mat-header-cell *matHeaderCellDef>Alerta</th>
    <td mat-cell *matCellDef="let c">
      <span
        class="alert-circle"
        [ngStyle]="{'background-color': getAlertColor(c)}"
        matTooltip="{{ getAlertLabel(c) }}"
        matTooltipPosition="above">
      </span>
      <!-- {{ getAlertLabel(c) }} -->
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let c">
      <button mat-icon-button color="primary" (click)="editCase(c)">
        <mat-icon>edit</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

</table>

<mat-paginator
  [pageSize]="5"
  [pageSizeOptions]="[5,10,25]"
  showFirstLastButtons>
</mat-paginator>
