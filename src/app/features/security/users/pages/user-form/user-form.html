<h2 style="margin:0 0 12px 0;">{{ isEdit ? 'Editar usuario' : 'Nuevo usuario' }}</h2>

<mat-card>
  <mat-card-content>
    <form [formGroup]="form" style="display:grid; gap:12px; max-width:820px;">

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <mat-form-field appearance="outline">
          <mat-label>Nombres</mat-label>
          <input matInput formControlName="firstName" />
          <mat-error *ngIf="firstNameCtrl?.touched && firstNameCtrl?.invalid">
            Nombres es requerido (mín 2 caracteres)
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Apellidos</mat-label>
          <input matInput formControlName="lastName" />
          <mat-error *ngIf="lastNameCtrl?.touched && lastNameCtrl?.invalid">
            Apellidos es requerido (mín 2 caracteres)
          </mat-error>
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" />
        <mat-error *ngIf="emailCtrl?.touched && emailCtrl?.invalid">
          Email inválido
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Roles</mat-label>
        <mat-select formControlName="roleIds" multiple>
          <mat-option *ngFor="let r of (roles$ | async) ?? []" [value]="r.id">
            {{ r.name }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="roleIdsCtrl?.touched && roleIdsCtrl?.invalid">
          Selecciona al menos un rol
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Estado</mat-label>
        <mat-select formControlName="active">
          <mat-option [value]="true">Activo</mat-option>
          <mat-option [value]="false">Inactivo</mat-option>
        </mat-select>
      </mat-form-field>

      <div style="display:flex; gap:10px; justify-content:flex-end;">
        <button mat-button type="button" (click)="cancel()">Cancelar</button>
        <button mat-raised-button color="primary" type="button" (click)="save()">Guardar</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
