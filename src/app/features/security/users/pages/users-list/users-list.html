<div style="display:flex; align-items:center; gap:12px; justify-content:space-between; margin-bottom:12px;">
  <h2 style="margin:0;">Usuarios</h2>

  <div style="display:flex; gap:12px; align-items:center;">
    <mat-form-field appearance="outline" style="width:280px;">
      <mat-label>Buscar</mat-label>
      <input matInput [(ngModel)]="filter" placeholder="Nombre, email o rol">
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="goNew()">
      <mat-icon>add</mat-icon>
      Nuevo usuario
    </button>
  </div>
</div>

<table mat-table [dataSource]="(rows$ | async) ?? []" class="mat-elevation-z1" style="width:100%;">

  <ng-container matColumnDef="fullName">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let u">{{ u.firstName }} {{ u.lastName }}</td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let u">{{ u.email }}</td>
  </ng-container>

  <ng-container matColumnDef="roles">
    <th mat-header-cell *matHeaderCellDef>Roles</th>
    <td mat-cell *matCellDef="let u">{{ u.roleNames }}</td>
  </ng-container>

  <ng-container matColumnDef="active">
    <th mat-header-cell *matHeaderCellDef>Activo</th>
    <td mat-cell *matCellDef="let u">{{ u.active ? 'Sí' : 'No' }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef style="width:200px;">Acciones</th>
    <td mat-cell *matCellDef="let u" style="display:flex; gap:8px;">
      <button mat-stroked-button (click)="goEdit(u.id)">Editar</button>
      <button mat-button (click)="toggle(u.id)">{{ u.active ? 'Inactivar' : 'Activar' }}</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
