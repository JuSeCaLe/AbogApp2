<h2 style="margin:0 0 12px 0;">{{ isEdit ? 'Editar rol' : 'Nuevo rol' }}</h2>

<div *ngIf="isSystemRole" class="mat-error" style="margin-bottom:12px;">
  Este es un rol del sistema y no puede modificarse.
</div>

<mat-card>
  <mat-card-content>
    <form [formGroup]="form" style="display:grid; gap:12px; max-width:720px;">
      <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="name" />
        <mat-error *ngIf="nameCtrl?.touched && nameCtrl?.invalid">
          Nombre es requerido (mín 2 caracteres)
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Descripción</mat-label>
        <textarea matInput rows="3" formControlName="description"></textarea>
      </mat-form-field>

      <div style="display:flex; align-items:center; gap:12px;">
        <span style="font-weight:600;">Estado</span>
        <mat-slide-toggle formControlName="active" color="primary">
          {{ form.get('active')?.value ? 'Activo' : 'Inactivo' }}
        </mat-slide-toggle>
      </div>

      <mat-checkbox formControlName="isDemandante">
        Es un rol de demandante
      </mat-checkbox>

      <div style="display:flex; gap:10px; justify-content:flex-end;">
        <button mat-button type="button" (click)="cancel()">Cancelar</button>
        <button mat-raised-button color="primary" type="button" [disabled]="isSystemRole" (click)="save()">Guardar</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
