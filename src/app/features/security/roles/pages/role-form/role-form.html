<h2 style="margin:0 0 12px 0;">{{ isEdit ? 'Editar rol' : 'Nuevo rol' }}</h2>

<mat-card>
  <mat-card-content>
    <form [formGroup]="form" style="display:grid; gap:12px; max-width:720px;">
      <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="name" />
        <mat-error *ngIf="nameCtrl?.touched && nameCtrl?.invalid">
          Nombre es requerido (mín 2 caracteres)
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Descripción</mat-label>
        <textarea matInput rows="3" formControlName="description"></textarea>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Estado</mat-label>
        <mat-select formControlName="active">
          <mat-option [value]="true">Activo</mat-option>
          <mat-option [value]="false">Inactivo</mat-option>
        </mat-select>
      </mat-form-field>

      <div style="display:flex; gap:10px; justify-content:flex-end;">
        <button mat-button type="button" (click)="cancel()">Cancelar</button>
        <button mat-raised-button color="primary" type="button" (click)="save()">Guardar</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
