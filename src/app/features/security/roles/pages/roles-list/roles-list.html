<div style="display:flex; align-items:center; gap:12px; justify-content:space-between; margin-bottom:12px;">
  <h2 style="margin:0;">Roles</h2>

  <div style="display:flex; gap:12px; align-items:center;">
    <button mat-stroked-button type="button" (click)="reload()">
      <mat-icon>refresh</mat-icon>
      Refrescar
    </button>

    <mat-form-field appearance="outline" style="width:280px;">
      <mat-label>Buscar</mat-label>
      <input matInput [formControl]="search" placeholder="Nombre o descripción">
    </mat-form-field>

    <button mat-raised-button color="primary" type="button" (click)="goNew()">
      <mat-icon>add</mat-icon>
      Nuevo rol
    </button>
  </div>
</div>

<div *ngIf="error" style="color:#b00020; margin-bottom:12px;">
  {{ error }}
</div>

<table mat-table [dataSource]="(filtered$ | async) ?? []" class="mat-elevation-z1" style="width:100%;">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let r">{{ r.name }}</td>
  </ng-container>

  <ng-container matColumnDef="description">
    <th mat-header-cell *matHeaderCellDef>Descripción</th>
    <td mat-cell *matCellDef="let r">{{ r.description || '-' }}</td>
  </ng-container>

  <ng-container matColumnDef="createdAt">
    <th mat-header-cell *matHeaderCellDef>Creado</th>
    <td mat-cell *matCellDef="let r">
      {{ r.createdAt | date:'short' }}
    </td>
  </ng-container>

  <ng-container matColumnDef="active">
    <th mat-header-cell *matHeaderCellDef>Activo</th>
    <td mat-cell *matCellDef="let r">
      <mat-slide-toggle
        [checked]="r.active"
        disabled="true"
        color="primary"
        aria-label="Activo">
      </mat-slide-toggle>
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef class="actions-col">Acciones</th>

    <td mat-cell *matCellDef="let x" class="actions-col">
      <div class="actions-wrap">
        <button
          mat-icon-button
          type="button"
          (click)="goEdit(x)"
          aria-label="Editar">
          <mat-icon>edit</mat-icon>
        </button>

        <button
          mat-icon-button
          type="button"
          (click)="remove(x)"
          aria-label="Eliminar">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
