<div style="display:flex; align-items:center; gap:12px; justify-content:space-between; margin-bottom:12px;">
  <h2 style="margin:0;">Roles</h2>

  <div style="display:flex; gap:12px; align-items:center;">
    <mat-form-field appearance="outline" style="width:280px;">
      <mat-label>Buscar</mat-label>
      <input matInput [(ngModel)]="filter" placeholder="Nombre o descripción">
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="goNew()">
      <mat-icon>add</mat-icon>
      Nuevo rol
    </button>
  </div>
</div>

<table mat-table [dataSource]="(filtered$ | async) ?? []" class="mat-elevation-z1" style="width:100%;">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let r">{{ r.name }}</td>
  </ng-container>

  <ng-container matColumnDef="description">
    <th mat-header-cell *matHeaderCellDef>Descripción</th>
    <td mat-cell *matCellDef="let r">{{ r.description || '-' }}</td>
  </ng-container>

  <ng-container matColumnDef="active">
    <th mat-header-cell *matHeaderCellDef>Activo</th>
    <td mat-cell *matCellDef="let r">
      <span>{{ r.active ? 'Sí' : 'No' }}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef style="width:180px;">Acciones</th>
    <td mat-cell *matCellDef="let r" style="display:flex; gap:8px;">
      <button mat-stroked-button (click)="goEdit(r.id)">Editar</button>
      <button mat-button (click)="toggle(r.id)">{{ r.active ? 'Inactivar' : 'Activar' }}</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
