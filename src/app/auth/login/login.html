<div class="login-wrapper">
  <mat-card class="login-card mat-elevation-z8">

    <div class="login-header">
      <img src="../logo.png" alt="Logo" class="logo_login" />
      <h1 class="login-title">AbogApp</h1>
      <p class="login-subtitle">Inicia sesión para continuar</p>
    </div>

    <mat-card-content class="login-content">
      <mat-form-field appearance="outline" class="full">
        <mat-label>Usuario</mat-label>
        <input matInput [(ngModel)]="email" autocomplete="username">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" [(ngModel)]="password" autocomplete="current-password">
      </mat-form-field>

      <button mat-raised-button color="primary" class="full login-btn" (click)="submit()">
        Entrar
      </button>

      <mat-error *ngIf="error" class="login-error">
        Usuario o contraseña incorrectos
      </mat-error>
    </mat-card-content>
  </mat-card>
</div>
