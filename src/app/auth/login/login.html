<mat-card style="max-width:360px; margin:80px auto;">
  <mat-card-title>Login (Mock)</mat-card-title>

  <mat-card-content style="display:flex; flex-direction:column; gap:12px;">
    <button mat-raised-button color="primary" (click)="loginAsAdmin()">
      Entrar como Administrador
    </button>

    <button mat-stroked-button (click)="loginAsLawyer()">
      Entrar como Abogado
    </button>
  </mat-card-content>
</mat-card>
