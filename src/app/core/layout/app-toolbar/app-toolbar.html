<mat-toolbar color="primary" style="display:flex; justify-content:space-between;">
  <button mat-icon-button (click)="toggleMenu()">
    <mat-icon>menu</mat-icon>
  </button>
  <span>AbogApp2</span>
  <img
        src="/logo.png"
        alt="ChatGPT"
        class="logo" />

  <span class="spacer"></span>

  <ng-container *ngIf="auth.snapshot as user">
    <span style="margin-right:12px;">
      {{ user.fullName }}
    </span>

    <button mat-raised-button color="primary" type="button" (click)="logout()">
      <mat-icon>logout</mat-icon> Salir
    </button>
  </ng-container>
</mat-toolbar>
