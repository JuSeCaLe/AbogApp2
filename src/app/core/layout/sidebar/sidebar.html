<mat-nav-list>

  <a mat-list-item routerLink="/dashboard" routerLinkActive="active">
    <mat-icon>dashboard</mat-icon>
    <span>Dashboard</span>
  </a>

  <!-- Casos -->
  <a mat-list-item routerLink="/cases" routerLinkActive="active">
    <mat-icon>folder</mat-icon>
    <span>Casos</span>
  </a>

  <ng-container *ngIf="auth.hasRole('r-admin')">
    <mat-expansion-panel>
    <mat-expansion-panel-header>
      <mat-panel-title>Seguridad</mat-panel-title>
    </mat-expansion-panel-header>

    <a mat-list-item routerLink="/security/roles" routerLinkActive="active">Roles</a>
    <a mat-list-item routerLink="/security/users" routerLinkActive="active">Usuarios</a>
  </mat-expansion-panel>
  <mat-expansion-panel>
    <mat-expansion-panel-header>
      <mat-panel-title>Paramétricas</mat-panel-title>
    </mat-expansion-panel-header>

    <a mat-list-item routerLink="/parametrics/courts" routerLinkActive="active">Juzgados</a>
    <a mat-list-item routerLink="/parametrics/plaintiffs" routerLinkActive="active">Demandantes</a>
    <a mat-list-item routerLink="/parametrics/obligations" routerLinkActive="active">Obligaciones</a>
  </mat-expansion-panel>
</ng-container>

</mat-nav-list>
